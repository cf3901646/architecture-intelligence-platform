# Operator-authored AsyncAPI overlay for the v0.5.1 demo - NOT an upstream document. Quarkus Super
# Heroes ships no AsyncAPI; see ../../PROVENANCE.md for the upstream code this declares.
asyncapi: '2.6.0'
info:
  # The title becomes the Service display name, so it matches the existing one (the upstream
  # rest-fights OpenAPI info.title).
  title: Fights API
  description: Operator-authored overlay for the AIP v0.5.1 demo, not an upstream document.
  version: "1.0.0"
x-aip-service-id: service:rest-fights
servers:
  fights-kafka:
    url: fights-kafka:9092
    protocol: kafka
    x-aip-broker-id: kafka:fights-kafka
channels:
  fights:
    x-aip-destination-kind: topic
    publish:
      operationId: publishFight
      message:
        $ref: '#/components/messages/Fight'
components:
  messages:
    Fight:
      name: Fight
      # Transcribed from upstream rest-fights/src/main/avro/fight.avsc (record
      # io.quarkus.sample.superheroes.fight.schema.Fight) at 8ea03377bfe7a89c49e1ccc0e501bf5fafbc2cce.
      payload:
        type: object
        required: [fightDate, winnerName, winnerLevel, loserName, loserLevel, winnerTeam, loserTeam]
        properties:
          id: {type: [string, "null"]}
          fightDate: {type: integer, description: "Avro long, logicalType timestamp-micros"}
          winnerName: {type: string}
          winnerLevel: {type: integer}
          winnerPicture: {type: [string, "null"]}
          loserName: {type: string}
          loserLevel: {type: integer}
          loserPicture: {type: [string, "null"]}
          winnerTeam: {type: string}
          loserTeam: {type: string}
