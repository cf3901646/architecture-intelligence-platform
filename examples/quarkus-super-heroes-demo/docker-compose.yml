# v0.5.1 Quarkus Super Heroes demo stack (spec §4). run.sh is the only caller. It always invokes
# `docker compose -p aip-qsh-demo --project-directory <repo> -f <this file> --env-file /dev/null`,
# so relative paths resolve from the repository root and no .env or override file can leak in.
# The dossier inputs are mounted read-only and unmodified.
services:
  architecture-intelligence:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${QSH_DEMO_NEO4J_PASSWORD:?set by run.sh}
      OPENAI_API_KEY: ""
      CONFIG_PATH: qsh/config.yaml
    volumes:
      - ./examples/quarkus-super-heroes-demo/config.yaml:/app/qsh/config.yaml:ro
      - ./examples/quarkus-super-heroes-demo/check_ready.py:/app/qsh/check_ready.py:ro
      - ./examples/quarkus-super-heroes-demo/overlay:/app/qsh/overlay:ro
      - ./docs/real-world-validation/v0.5.0/quarkus-super-heroes/runtime/declarations:/app/qsh/declarations:ro
      - ./docs/real-world-validation/v0.5.0/quarkus-super-heroes/runtime/k8s/namespaced:/app/qsh/k8s/namespaced:ro
      - ./docs/real-world-validation/v0.5.0/quarkus-super-heroes/runtime/mapping.yaml:/app/qsh/mapping.yaml:ro
    ports:
      # 8000 exactly: the default MCP host allowlist is localhost:8000 / 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      interval: 1s

  neo4j:
    image: neo4j:5.26.0@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    environment:
      NEO4J_AUTH: neo4j/${QSH_DEMO_NEO4J_PASSWORD:?set by run.sh}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0@sha256:7725a7a10c87d8853208bdd4bb3439ad3c0d7b32b4292b9300ac07c8daba14a2
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./examples/runtime-demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      architecture-intelligence:
        condition: service_started
